<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dota 2 Analytics — Стильный дизайн | Winrate & Pickrate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 20% 30%, #0f0c1f 0%, #05030f 100%);
            font-family: 'Inter', sans-serif;
            color: #eef2ff;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
        }
        .tgsvg{
            position: absolute;
            height: 65px;
            width: 65px;
            left: 97%;
            top: 1px;
        }
        /* Анимированные декоративные элементы */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(109, 142, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(111, 207, 151, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(230, 126, 126, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: pulseBg 8s ease-in-out infinite;
        }

        @keyframes pulseBg {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(109, 142, 255, 0.12);
            backdrop-filter: blur(12px);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #a3b3e0;
            margin-bottom: 1rem;
            border: 1px solid rgba(109, 142, 255, 0.25);
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF 0%, #b9c8ff 50%, #6d8eff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
            letter-spacing: -1px;
        }

        .sub {
            color: #8f9bb5;
            font-size: 0.95rem;
            opacity: 0.8;
        }

        /* Input card */
        .input-card {
            background: rgba(18, 22, 40, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 1rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(109, 142, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
        }

        .input-card input {
            flex: 2;
            min-width: 220px;
            background: rgba(11, 14, 22, 0.8);
            border: 1px solid rgba(109, 142, 255, 0.2);
            padding: 0.9rem 1.3rem;
            border-radius: 1.5rem;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-card input:focus {
            border-color: #6d8eff;
            box-shadow: 0 0 0 3px rgba(109, 142, 255, 0.2);
        }

        .period-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            background: rgba(11, 14, 22, 0.6);
            padding: 0.3rem 0.8rem;
            border-radius: 3rem;
        }

        .period-btn {
            background: transparent;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            color: #b0b8d4;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .period-btn.active {
            background: linear-gradient(135deg, #3e5a9c, #2c3e6e);
            color: white;
            box-shadow: 0 4px 12px rgba(62, 90, 156, 0.3);
        }

        .period-btn:hover:not(.active) {
            background: rgba(109, 142, 255, 0.2);
            color: white;
        }

        .date-range {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            background: rgba(11, 14, 22, 0.6);
            padding: 0.3rem 1rem;
            border-radius: 2rem;
        }

        .date-range input {
            background: #1a1f30;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 1rem;
            color: white;
            width: 120px;
            font-size: 0.75rem;
        }

        .fetch-btn {
            background: linear-gradient(135deg, #3e5a9c, #2c3e6e);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(62, 90, 156, 0.3);
        }

        .fetch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(62, 90, 156, 0.4);
        }

        /* Hero selector */
        .hero-selector-section {
            background: rgba(18, 22, 40, 0.5);
            backdrop-filter: blur(16px);
            border-radius: 1.5rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
            border: 1px solid rgba(109, 142, 255, 0.15);
        }

        .hero-search {
            flex: 1;
            background: rgba(11, 14, 22, 0.8);
            border: 1px solid rgba(109, 142, 255, 0.2);
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }

        .hero-search:focus {
            border-color: #6d8eff;
        }

        .hero-select {
            flex: 2;
            background: rgba(11, 14, 22, 0.8);
            border: 1px solid rgba(109, 142, 255, 0.2);
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .hero-stats-btn {
            background: linear-gradient(135deg, #4a6aae, #3a5a9e);
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .hero-stats-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #5a7abe, #4a6aae);
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #0f1228, #0a0d1a);
            border-radius: 2rem;
            max-width: 950px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.8rem;
            border: 1px solid rgba(109, 142, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            float: right;
            font-size: 1.8rem;
            cursor: pointer;
            color: #a3b3e0;
            transition: 0.2s;
        }

        .modal-close:hover {
            color: white;
        }

        /* Match cards */
        .match-card {
            background: linear-gradient(135deg, rgba(10, 13, 24, 0.8), rgba(5, 7, 15, 0.9));
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            margin-bottom: 0.8rem;
            cursor: pointer;
            border-left: 4px solid #6fcf97;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .match-card.loss {
            border-left-color: #e67e7e;
        }

        .match-card:hover {
            transform: translateX(6px) translateY(-2px);
            background: linear-gradient(135deg, rgba(20, 25, 45, 0.9), rgba(10, 13, 24, 0.95));
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .match-hero {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .match-hero-img {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #1a1f30;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .match-result {
            font-weight: 700;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
        }

        .match-result.win {
            background: rgba(111, 207, 151, 0.15);
            color: #6fcf97;
            border: 1px solid rgba(111, 207, 151, 0.3);
        }

        .match-result.loss {
            background: rgba(230, 126, 126, 0.15);
            color: #e67e7e;
            border: 1px solid rgba(230, 126, 126, 0.3);
        }

        .match-items {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .match-item {
            width: 36px;
            height: 36px;
            background: #1e243b;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: 0.2s;
        }

        .match-item img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .match-item.skeleton {
            background: linear-gradient(90deg, #1a1f30 25%, #2a2f42 50%, #1a1f30 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Players grid */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .player-card {
            background: rgba(10, 13, 24, 0.7);
            border-radius: 1rem;
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            transition: 0.2s;
        }

        .player-card.radiant {
            border-left: 3px solid #6fcf97;
        }

        .player-card.dire {
            border-left: 3px solid #e67e7e;
        }

        .player-hero {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.5rem;
        }

        .player-hero-img {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #1e243b;
            object-fit: cover;
        }

        /* Dashboard cards */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .card {
            background: rgba(18, 22, 40, 0.5);
            backdrop-filter: blur(16px);
            border-radius: 1.8rem;
            padding: 1.5rem;
            border: 1px solid rgba(109, 142, 255, 0.15);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(109, 142, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            margin-bottom: 1.2rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-left: 3px solid #6d8eff;
            padding-left: 0.8rem;
        }

        .chart-container {
            height: 260px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Winrate circle */
        .winrate-circle {
            text-align: center;
            padding: 1rem;
        }

        .winrate-percent {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #a3b3e0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* Barchart */
        .barchart-container {
            margin-top: 0.5rem;
        }

        .bar-item {
            margin-bottom: 0.9rem;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.3rem;
            font-size: 0.75rem;
        }

        .bar-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .bar-percent {
            color: #8f9bb5;
        }

        .bar-bg {
            background: #1a1f30;
            border-radius: 20px;
            height: 28px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(90deg, #4d6ecf, #6d8eff, #8aa3e6);
            width: 0%;
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Hero list with avatars */
        .hero-list {
            max-height: 450px;
            overflow-y: auto;
        }

        .hero-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.7rem 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            border-radius: 0.8rem;
            transition: all 0.2s ease;
            gap: 10px;
        }

        .hero-item:hover {
            background: rgba(109, 142, 255, 0.15);
            transform: translateX(4px);
        }

        .hero-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hero-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1f30, #2a2f42);
            object-fit: cover;
            border: 1px solid rgba(109, 142, 255, 0.3);
        }

        .hero-name {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .hero-stats-text {
            font-size: 0.8rem;
            color: #8f9bb5;
            font-family: monospace;
        }

        .recent-matches-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 1rem;
        }

        .recent-match-item {
            background: rgba(10, 13, 24, 0.6);
            border-radius: 0.8rem;
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }

        .recent-match-item:hover {
            background: rgba(109, 142, 255, 0.15);
            transform: translateX(4px);
        }

        .loading-panel {
            background: rgba(18, 22, 40, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 2.5rem;
            text-align: center;
            border: 1px solid rgba(109, 142, 255, 0.2);
        }

        .spinner {
            width: 56px;
            height: 56px;
            border: 3px solid rgba(109, 142, 255, 0.2);
            border-top-color: #6d8eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            background: rgba(46, 26, 42, 0.9);
            backdrop-filter: blur(8px);
            border-left: 4px solid #ff7b72;
            padding: 1rem;
            border-radius: 1rem;
            margin: 1rem 0;
        }

        .profile-header {
            background: rgba(18, 22, 40, 0.5);
            backdrop-filter: blur(16px);
            border-radius: 1.5rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid rgba(109, 142, 255, 0.15);
        }

        .period-info {
            background: rgba(10, 13, 24, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 1rem;
            padding: 0.5rem 1rem;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: #a3b3e0;
        }

        .load-more-btn {
            background: linear-gradient(135deg, #1a1f30, #2a2f42);
            border: 1px solid rgba(109, 142, 255, 0.3);
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 1rem;
            width: 100%;
            transition: all 0.3s ease;
        }

        .load-more-btn:hover {
            background: linear-gradient(135deg, #2a2f42, #3a3f52);
            border-color: #6d8eff;
            transform: translateY(-2px);
        }

        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1f2e;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a6aae;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6d8eff;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            h1 {
                font-size: 2rem;
            }
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<div class="container">
    <div class="header">
        <div class="badge">
            <span>⚔️</span> OPENDOTA API <span>⚔️</span>
        </div>
        <h1>Dota 2 Hero Analytics</h1>
        <div class="sub">Винрейт • Пикрейт • История матчей</div>
    </div>

    <div class="input-card">
        <input type="text" id="steamInput" placeholder="Steam профиль" value="https://steamcommunity.com/profiles/76561198968140804/">
        <div class="period-selector" id="periodSelector">
            <button class="period-btn" data-period="20">20 игр</button>
            <button class="period-btn" data-period="month">Месяц</button>
            <button class="period-btn" data-period="3months">3 месяца</button>
            <button class="period-btn" data-period="custom">Свои даты</button>
        </div>
        <div class="date-range" id="dateRange" style="display: none;">
            <input type="date" id="startDate"> — <input type="date" id="endDate">
        </div>
        <button class="fetch-btn" id="fetchBtn">Анализировать</button>
    </div>

    <div id="heroSelectorSection" style="display: none;" class="hero-selector-section">
        <input type="text" id="heroSearch" placeholder="🔍 Поиск героя..." class="hero-search">
        <select id="heroSelect" class="hero-select"><option>-- Выберите героя --</option></select>
        <button id="showHeroStatsBtn" class="hero-stats-btn">📊 Статистика героя</button>
    </div>

    <div id="loadingPanel" style="display: none;" class="loading-panel">
        <div class="spinner"></div>
        <p id="loadingText">Загрузка данных...</p>
    </div>
    <div id="dashboard" style="display: none;"></div>
    <div id="errorMsg" class="error-msg" style="display: none;"></div>
</div>

<div id="heroModal" class="modal"><div class="modal-content"><span class="modal-close" onclick="closeHeroModal()">&times;</span><h3 id="heroModalTitle"></h3><div id="heroModalContent"></div><h4>📜 Последние 20 матчей</h4><div id="heroRecentMatches" class="recent-matches-list"></div></div></div>
<div id="matchModal" class="modal"><div class="modal-content"><span class="modal-close" onclick="closeMatchModal()">&times;</span><h3 id="matchModalTitle"></h3><div id="matchModalContent"></div></div></div>

<script>
    const OPENDOTA_BASE = 'https://api.opendota.com';
    let globalHeroesList = [], globalAllMatches = [], globalAccountId = null;
    let currentPeriod = '20';
    let matchesDetailsCache = new Map();
    let itemsCache = new Map();
    let currentAbortController = null;
    let currentDisplayLimit = 20;
    let itemsLoadingPromises = new Map();

    const HERO_CDN = 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes';

    async function fastFetch(endpoint, timeoutMs = 10000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const response = await fetch(OPENDOTA_BASE + endpoint, {
                signal: controller.signal,
                headers: { 'User-Agent': 'Dota2Analytics/1.0' }
            });
            clearTimeout(timeoutId);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        } catch (err) {
            clearTimeout(timeoutId);
            throw err;
        }
    }

    async function loadItemsList() {
        if (itemsCache.size > 0) return;
        try {
            const items = await fastFetch('/api/constants/items');
            for (const [key, value] of Object.entries(items)) {
                itemsCache.set(value.id, { name: key, img: value.img });
            }
        } catch(e) { console.error('Items load error:', e); }
    }

    function getItemImageUrl(itemId) {
        if (!itemId || itemId === 0) return null;
        const item = itemsCache.get(itemId);
        if (item && item.img) {
            return `https://cdn.cloudflare.steamstatic.com${item.img}`;
        }
        return null;
    }

    function getHeroImg(heroId) {
        const hero = globalHeroesList.find(h => h.id === heroId);
        if (!hero) return 'https://via.placeholder.com/44';
        const name = hero.localized_name.toLowerCase().replace(/ /g, '_');
        return `${HERO_CDN}/${name}.png`;
    }

    function getHeroName(heroId) {
        const hero = globalHeroesList.find(h => h.id === heroId);
        return hero ? hero.localized_name : `Hero #${heroId}`;
    }

    async function resolveSteamId(input) {
        let trimmed = input.trim();
        if (/^\d+$/.test(trimmed)) return parseInt(trimmed);
        let profileMatch = trimmed.match(/steamcommunity\.com\/profiles\/(\d+)/i);
        if (profileMatch) {
            let steam64 = profileMatch[1];
            return Number(BigInt(steam64) - 76561197960265728n);
        }
        let vanityMatch = trimmed.match(/steamcommunity\.com\/id\/([a-zA-Z0-9_]+)/i);
        if (vanityMatch) {
            const data = await fastFetch(`/api/search?q=${encodeURIComponent(vanityMatch[1])}`);
            if (data?.length) return data[0].account_id;
        }
        throw new Error("Не удалось определить Steam ID");
    }

    async function getMatchDetails(matchId) {
        if (matchesDetailsCache.has(matchId)) return matchesDetailsCache.get(matchId);
        const data = await fastFetch(`/api/matches/${matchId}`, 15000);
        matchesDetailsCache.set(matchId, data);
        return data;
    }

    async function loadSingleMatchItems(match) {
        if (itemsLoadingPromises.has(match.match_id)) return itemsLoadingPromises.get(match.match_id);
        
        const promise = (async () => {
            try {
                const matchDetail = await getMatchDetails(match.match_id);
                const player = matchDetail?.players?.find(p => p.player_slot === match.player_slot);
                if (player) {
                    const items = [player.item_0, player.item_1, player.item_2, player.item_3, player.item_4, player.item_5].filter(i => i && i > 0);
                    const container = document.getElementById(`items-${match.match_id}`);
                    if (container) {
                        if (items.length) {
                            container.innerHTML = items.map(itemId => {
                                const url = getItemImageUrl(itemId);
                                return url ? `<div class="match-item"><img src="${url}" onerror="this.style.display='none'"></div>` : '<div class="match-item">?</div>';
                            }).join('');
                        } else {
                            container.innerHTML = '<span style="font-size:0.6rem;color:#8f9bb5;">—</span>';
                        }
                    }
                }
            } catch(e) { /* тихо */ }
        })();
        
        itemsLoadingPromises.set(match.match_id, promise);
        return promise;
    }

    function filterMatchesByPeriod(matches, period, startDateCustom, endDateCustom) {
        if (period === '20') return matches.slice(0, 20);
        const now = Math.floor(Date.now() / 1000);
        let startTime;
        if (period === 'month') startTime = now - 30 * 24 * 60 * 60;
        else if (period === '3months') startTime = now - 90 * 24 * 60 * 60;
        else if (period === 'custom' && startDateCustom && endDateCustom) {
            startTime = Math.floor(new Date(startDateCustom).getTime() / 1000);
            const endTime = Math.floor(new Date(endDateCustom).getTime() / 1000);
            return matches.filter(m => m.start_time >= startTime && m.start_time <= endTime);
        } else return matches;
        return matches.filter(m => m.start_time >= startTime);
    }

    window.showHeroStats = async (heroName) => {
        const hero = globalHeroesList.find(h => h.localized_name === heroName);
        if (!hero) return;
        const heroMatches = globalAllMatches.filter(m => m.hero_id === hero.id);
        const wins = heroMatches.filter(m => m.radiant_win === (m.player_slot < 128)).length;
        const total = heroMatches.length;
        const winrate = total > 0 ? (wins / total * 100) : 0;
        
        document.getElementById('heroModalTitle').innerHTML = `📊 ${heroName} - Винрейт`;
        document.getElementById('heroModalContent').innerHTML = `
            <div class="winrate-circle">
                <div class="winrate-percent ${winrate >= 50 ? 'win' : 'loss'}">${winrate.toFixed(1)}%</div>
                <div>${wins}W / ${total - wins}L (${total} игр)</div>
                <canvas id="heroWinChart" style="max-height:200px;margin-top:1rem;"></canvas>
            </div>`;
        
        setTimeout(() => {
            const ctx = document.getElementById('heroWinChart')?.getContext('2d');
            if (ctx) {
                new Chart(ctx, { 
                    type: 'pie', 
                    data: { labels: ['Победы', 'Поражения'], datasets: [{ data: [wins, total - wins], backgroundColor: ['#6fcf97', '#e67e7e'] }] },
                    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { color: '#ccd6f0' } } } }
                });
            }
        }, 100);
        
        document.getElementById('heroRecentMatches').innerHTML = heroMatches.slice(0, 20).map(m => {
            const isWin = m.radiant_win === (m.player_slot < 128);
            const date = new Date(m.start_time * 1000).toLocaleString();
            return `<div class="recent-match-item" onclick="showMatchDetails(${m.match_id})" style="border-left:3px solid ${isWin ? '#6fcf97' : '#e67e7e'}">
                        <span>📅 ${date}</span>
                        <span style="color:${isWin ? '#6fcf97' : '#e67e7e'}">${isWin ? 'Победа' : 'Поражение'}</span>
                    </div>`;
        }).join('');
        document.getElementById('heroModal').style.display = 'flex';
    };

    window.showMatchDetails = async (matchId) => {
        const match = await getMatchDetails(matchId);
        if (!match) return;
        const duration = new Date(match.duration * 1000).toISOString().substr(11, 8);
        const date = new Date(match.start_time * 1000).toLocaleString();
        document.getElementById('matchModalTitle').innerHTML = `🎮 Матч от ${date} • ${duration} • ${match.radiant_win ? 'Radiant победила' : 'Dire победила'}`;
        
        const players = match.players || [];
        const radiantPlayers = players.filter(p => p.player_slot < 128).sort((a,b) => a.player_slot - b.player_slot);
        const direPlayers = players.filter(p => p.player_slot >= 128).sort((a,b) => a.player_slot - b.player_slot);
        
        document.getElementById('matchModalContent').innerHTML = `
            <div class="players-grid">
                <div><h4 style="color:#6fcf97">☀️ RADIANT</h4>
                    ${radiantPlayers.map(p => {
                        const items = [p.item_0, p.item_1, p.item_2, p.item_3, p.item_4, p.item_5].filter(i => i && i > 0);
                        return `<div class="player-card radiant">
                            <div class="player-hero">
                                <img class="player-hero-img" src="${getHeroImg(p.hero_id)}" onerror="this.src='https://via.placeholder.com/36'">
                                <strong>${getHeroName(p.hero_id)}</strong>
                            </div>
                            <div>📊 KDA: ${p.kills}/${p.deaths}/${p.assists} | Уровень: ${p.level}</div>
                            <div class="match-items">
                                ${items.map(itemId => {
                                    const url = getItemImageUrl(itemId);
                                    return url ? `<div class="match-item"><img src="${url}" onerror="this.style.display='none'"></div>` : '<div class="match-item">?</div>';
                                }).join('') || '—'}
                            </div>
                        </div>`;
                    }).join('')}
                </div>
                <div><h4 style="color:#e67e7e">🌙 DIRE</h4>
                    ${direPlayers.map(p => {
                        const items = [p.item_0, p.item_1, p.item_2, p.item_3, p.item_4, p.item_5].filter(i => i && i > 0);
                        return `<div class="player-card dire">
                            <div class="player-hero">
                                <img class="player-hero-img" src="${getHeroImg(p.hero_id)}" onerror="this.src='https://via.placeholder.com/36'">
                                <strong>${getHeroName(p.hero_id)}</strong>
                            </div>
                            <div>📊 KDA: ${p.kills}/${p.deaths}/${p.assists} | Уровень: ${p.level}</div>
                            <div class="match-items">
                                ${items.map(itemId => {
                                    const url = getItemImageUrl(itemId);
                                    return url ? `<div class="match-item"><img src="${url}" onerror="this.style.display='none'"></div>` : '<div class="match-item">?</div>';
                                }).join('') || '—'}
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>`;
        document.getElementById('matchModal').style.display = 'flex';
    };

    function closeHeroModal() { document.getElementById('heroModal').style.display = 'none'; }
    function closeMatchModal() { document.getElementById('matchModal').style.display = 'none'; }

    function renderPickrateBarchart(heroStats, totalGames) {
        const topHeroes = heroStats.slice(0, 10);
        return `
            <div class="barchart-container">
                ${topHeroes.map(hero => {
                    const percent = (hero.games / totalGames * 100).toFixed(1);
                    return `
                        <div class="bar-item">
                            <div class="bar-label">
                                <span class="bar-name" title="${hero.name}">${hero.name}</span>
                                <span class="bar-percent">${hero.games} игр (${percent}%)</span>
                            </div>
                            <div class="bar-bg">
                                <div class="bar-fill" style="width: ${percent}%">${percent > 15 ? percent+'%' : ''}</div>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    async function loadPrioritizedItems(matches, priorityCount = 10) {
        const priorityMatches = matches.slice(0, priorityCount);
        const restMatches = matches.slice(priorityCount);
        
        await Promise.all(priorityMatches.map(m => loadSingleMatchItems(m)));
        Promise.all(restMatches.map(m => loadSingleMatchItems(m))).catch(e => console.error);
    }

    function displayMatches(matches, container, startIndex, limit) {
        const endIndex = Math.min(startIndex + limit, matches.length);
        const matchesToShow = matches.slice(startIndex, endIndex);
        
        const html = matchesToShow.map(m => {
            const isWin = m.radiant_win === (m.player_slot < 128);
            const heroName = getHeroName(m.hero_id);
            const duration = new Date(m.duration * 1000).toISOString().substr(11, 8);
            const date = new Date(m.start_time * 1000).toLocaleString();
            return `<div class="match-card ${isWin ? 'win' : 'loss'}" onclick="showMatchDetails(${m.match_id})">
                        <div class="match-header">
                            <div class="match-hero">
                                <img class="match-hero-img" src="${getHeroImg(m.hero_id)}" onerror="this.src='https://via.placeholder.com/44'">
                                <div>
                                    <strong>${heroName}</strong>
                                    <div style="font-size:0.7rem;color:#8f9bb5;">${date}</div>
                                </div>
                            </div>
                            <div class="match-result ${isWin ? 'win' : 'loss'}">${isWin ? '✓ Победа' : '✗ Поражение'}</div>
                        </div>
                        <div style="font-size:0.7rem;color:#8f9bb5;">⏱️ ${duration}</div>
                        <div class="match-items" id="items-${m.match_id}">
                            ${Array(6).fill().map(() => '<div class="match-item skeleton"></div>').join('')}
                        </div>
                    </div>`;
        }).join('');
        
        container.innerHTML = html;
        loadPrioritizedItems(matchesToShow, 10);
        return endIndex;
    }

    function setupLoadMoreButton(matches, container) {
        const existingBtn = document.getElementById('loadMoreBtn');
        if (existingBtn) existingBtn.remove();
        
        if (currentDisplayLimit < matches.length) {
            const btnContainer = document.createElement('div');
            btnContainer.style.textAlign = 'center';
            btnContainer.style.marginTop = '1rem';
            
            const btn = document.createElement('button');
            btn.id = 'loadMoreBtn';
            btn.className = 'load-more-btn';
            btn.innerHTML = `📥 Загрузить еще (показано ${currentDisplayLimit} из ${matches.length})`;
            btn.onclick = () => {
                btn.disabled = true;
                btn.innerHTML = `⏳ Загрузка...`;
                const newEnd = displayMatches(matches, container, 0, currentDisplayLimit + 20);
                currentDisplayLimit = newEnd;
                if (currentDisplayLimit >= matches.length) {
                    btn.innerHTML = `✅ Все матчи загружены (${matches.length})`;
                    btn.disabled = true;
                } else {
                    btn.innerHTML = `📥 Загрузить еще (показано ${currentDisplayLimit} из ${matches.length})`;
                    btn.disabled = false;
                }
            };
            btnContainer.appendChild(btn);
            container.parentNode.appendChild(btnContainer);
        }
    }

    async function renderDashboardFast(profile, matches, periodLabel) {
        const dashboardDiv = document.getElementById('dashboard');
        dashboardDiv.style.display = 'block';
        const totalMatches = matches.length;
        const wins = matches.filter(m => m.radiant_win === (m.player_slot < 128)).length;
        const winrate = totalMatches > 0 ? (wins / totalMatches * 100) : 0;
        
        const heroMap = new Map();
        matches.forEach(m => {
            const hid = m.hero_id;
            const won = m.radiant_win === (m.player_slot < 128);
            if (!heroMap.has(hid)) heroMap.set(hid, { games: 0, wins: 0, name: getHeroName(hid), heroId: hid });
            const h = heroMap.get(hid);
            h.games++; if (won) h.wins++;
        });
        const heroStats = Array.from(heroMap.values()).map(h => ({ ...h, winrate: h.games > 0 ? (h.wins / h.games * 100) : 0 })).sort((a,b) => b.games - a.games);
        const rankTier = profile.rank_tier ? `${Math.floor(profile.rank_tier/10)}${'★'.repeat(profile.rank_tier%10)}` : 'Ранг не определён';
        
        dashboardDiv.innerHTML = `
            <div class="profile-header">
                <div><strong>🎮 ${profile.profile?.personaname || 'Игрок'}</strong> • 🆔 ${globalAccountId}</div>
                <div style="background: linear-gradient(135deg, #2a2f42, #1a1f30); padding: 0.3rem 1rem; border-radius: 2rem;">🏆 ${rankTier}</div>
            </div>
            <div class="period-info">📊 Период: ${periodLabel} • ${totalMatches} матчей</div>
            <div class="dashboard">
                <div class="card">
                    <h3>📊 Общий винрейт</h3>
                    <div class="winrate-circle">
                        <div class="winrate-percent">${winrate.toFixed(1)}%</div>
                        <div style="margin-top: 0.5rem;">${wins}W / ${totalMatches-wins}L</div>
                    </div>
                    <div class="chart-container">
                        <canvas id="winlossChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h3>🏆 Топ-10 пикрейта</h3>
                    ${renderPickrateBarchart(heroStats, totalMatches)}
                </div>
                <div class="card">
                    <h3>⚔️ Все герои (кликни)</h3>
                    <div class="hero-list" id="heroListContainer"></div>
                </div>
            </div>
            <div class="card" style="margin-top:1.5rem;">
                <h3>📜 История матчей (кликни для деталей)</h3>
                <div id="matchHistoryContainer"></div>
            </div>`;
        
        // Стильная круговая диаграмма
        const ctx = document.getElementById('winlossChart').getContext('2d');
        new Chart(ctx, { 
            type: 'doughnut', 
            data: { labels: ['Победы', 'Поражения'], datasets: [{ data: [wins, totalMatches - wins], backgroundColor: ['#6fcf97', '#e67e7e'], borderWidth: 0, hoverOffset: 15 }] },
            options: { 
                responsive: true, 
                maintainAspectRatio: true,
                cutout: '65%',
                plugins: { 
                    legend: { position: 'bottom', labels: { color: '#ccd6f0', font: { size: 12, weight: '500' }, usePointStyle: true, pointStyle: 'circle' } },
                    tooltip: { backgroundColor: '#0f1222', titleColor: '#fff', bodyColor: '#a3b3e0', borderColor: '#6d8eff', borderWidth: 1 }
                }
            }
        });
        
        // Список героев с аватарками
        const heroListContainer = document.getElementById('heroListContainer');
        heroListContainer.innerHTML = heroStats.map(h => `
            <div class="hero-item" onclick="showHeroStats('${h.name.replace(/'/g, "\\'")}')">
                <div class="hero-info">
                    <img class="hero-avatar" src="${getHeroImg(h.heroId)}" onerror="this.src='https://via.placeholder.com/36'">
                    <span class="hero-name">${h.name}</span>
                </div>
                <span class="hero-stats-text">${h.games} игр | ${h.winrate.toFixed(1)}%</span>
            </div>
        `).join('');
        
        const matchContainer = document.getElementById('matchHistoryContainer');
        currentDisplayLimit = 20;
        displayMatches(matches, matchContainer, 0, currentDisplayLimit);
        setupLoadMoreButton(matches, matchContainer);
    }

    async function setupHeroSelector() {
        const select = document.getElementById('heroSelect');
        select.innerHTML = '<option>-- Выберите героя --</option>' + globalHeroesList.map(h => `<option value="${h.id}">${h.localized_name}</option>`).join('');
        document.getElementById('heroSearch').oninput = (e) => {
            const term = e.target.value.toLowerCase();
            select.innerHTML = '<option>-- Выберите героя --</option>' + globalHeroesList.filter(h => h.localized_name.toLowerCase().includes(term)).map(h => `<option value="${h.id}">${h.localized_name}</option>`).join('');
        };
        document.getElementById('showHeroStatsBtn').onclick = () => {
            const heroId = document.getElementById('heroSelect').value;
            if (!heroId || heroId === '-- Выберите героя --') return alert('Выберите героя');
            const hero = globalHeroesList.find(h => h.id == heroId);
            if (hero) showHeroStats(hero.localized_name);
        };
    }

    const periodBtns = document.querySelectorAll('.period-btn');
    const dateRangeDiv = document.getElementById('dateRange');
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const today = new Date();
    const monthAgo = new Date(); monthAgo.setMonth(monthAgo.getMonth() - 1);
    startDateInput.value = monthAgo.toISOString().split('T')[0];
    endDateInput.value = today.toISOString().split('T')[0];
    
    periodBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            periodBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPeriod = btn.dataset.period;
            dateRangeDiv.style.display = currentPeriod === 'custom' ? 'flex' : 'none';
        });
    });
    document.querySelector('.period-btn[data-period="20"]').classList.add('active');

    async function main() {
        const input = document.getElementById('steamInput').value;
        if (!input) return;
        
        if (currentAbortController) currentAbortController.abort();
        currentAbortController = new AbortController();
        
        document.getElementById('loadingPanel').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('heroSelectorSection').style.display = 'none';
        itemsLoadingPromises.clear();
        
        try {
            await loadItemsList();
            
            const accountId = await resolveSteamId(input);
            globalAccountId = accountId;
            
            const [profile, allMatches, heroes] = await Promise.all([
                fastFetch(`/api/players/${accountId}`), 
                fastFetch(`/api/players/${accountId}/matches?limit=150&lobby_type=7`), 
                fastFetch('/api/heroes')
            ]);
            globalHeroesList = heroes;
            
            let startCustom = null, endCustom = null, periodLabel = '';
            if (currentPeriod === '20') periodLabel = 'Последние 20 игр';
            else if (currentPeriod === 'month') periodLabel = 'Последний месяц';
            else if (currentPeriod === '3months') periodLabel = 'Последние 3 месяца';
            else if (currentPeriod === 'custom') { 
                startCustom = startDateInput.value; 
                endCustom = endDateInput.value; 
                periodLabel = `${startCustom} — ${endCustom}`;
            }
            
            let filteredMatches = filterMatchesByPeriod(allMatches, currentPeriod, startCustom, endCustom);
            if (currentPeriod === '20') filteredMatches = filteredMatches.slice(0, 20);
            if (!filteredMatches.length) throw new Error('Нет матчей за выбранный период');
            globalAllMatches = filteredMatches;
            
            await renderDashboardFast(profile, filteredMatches, periodLabel);
            document.getElementById('heroSelectorSection').style.display = 'flex';
            await setupHeroSelector();
            document.getElementById('loadingPanel').style.display = 'none';
        } catch(err) {
            if (err.name === 'AbortError') return;
            document.getElementById('loadingPanel').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorMsg').innerHTML = `❌ Ошибка: ${err.message}<br><br><strong>Возможные решения:</strong><br>1. Проверьте интернет-соединение<br>2. Обновите страницу и попробуйте снова<br>3. API может быть перегружен — подождите 1-2 минуты`;
        }
    }
    
    document.getElementById('fetchBtn').onclick = main;
    window.onclick = (e) => { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; };
</script>
